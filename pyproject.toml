[project]
name = "pq-planqc"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "qiskit>=2.0",
    "mqt-qcec>=3.0.0b3",
    "numpy",
    "scipy",
    "marimo",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "qiskit-aer>=0.18.4",
    "playwright>=1.65",  # headless-browser checks of the bench/viz.py pages (docs/viz.md); never imported by compilers
    "esprima>=4.0.1",  # JS syntax check of the inline page scripts (docs/viz.md)
]
